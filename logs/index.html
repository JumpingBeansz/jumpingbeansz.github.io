<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Logs</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; display: flex; margin: 0; height: 100vh; }
        
        /* Sidebar for Navigation */
        nav { width: 250px; background: #24292e; color: white; padding: 1rem; overflow-y: auto; }
        nav h2 { font-size: 1.2rem; border-bottom: 1px solid #444; padding-bottom: 10px; }
        nav ul { list-style: none; padding: 0; }
        nav li { margin-bottom: 8px; }
        nav a { color: #adc6ff; text-decoration: none; cursor: pointer; font-size: 0.9rem; }
        nav a:hover { text-decoration: underline; }

        /* Main Content Area */
        main { flex: 1; padding: 2rem; overflow-y: auto; background: #fff; }
        #log-content { max-width: 800px; margin: 0 auto; }
        
        /* Basic Markdown Styling */
        #log-content h1 { border-bottom: 2px solid #eee; }
        #log-content code { background: #f4f4f4; padding: 2px 4px; border-radius: 4px; }
        #log-content pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
    </style>
</head>
<body>

    <nav>
        <h2>Log Archive</h2>
        <ul>
            <li>
                <a hx-get="2026/May/log_3_5_2026.md" 
                   hx-target="#log-content" 
                   hx-swap="innerHTML">
                   May 03, 2026
                </a>
            </li>
            <!-- This is a template, just duplicate this
            <li>
                <a hx-get="2026/May/log_3_5_2026.md" 
                   hx-target="#log-content" 
                   hx-swap="innerHTML">
                   May 03, 2026
                </a>
            </li>
            --!>
            </ul>
        <hr>
        <a href="../index.html" style="color: #ff79c6;">← Back Home</a>
    </nav>

    <main>
        <div id="log-content">
            <p>Select a log from the sidebar to view it.</p>
        </div>
    </main>

    <script>
        /**
         * This logic tells HTMX: 
         * "After you load the text file, run it through the Markdown parser."
         */
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            const contentDiv = document.getElementById('log-content');
            if (evt.detail.target.id === "log-content") {
                const rawMarkdown = contentDiv.innerText; // Get raw text
                contentDiv.innerHTML = marked.parse(rawMarkdown); // Render it
            }
        });
    </script>
</body>
</html>
