<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>*** GAME IDEA GENERATOR 2000 ***</title>
    <style>
        /* 90s Retro Styles */
        body { 
            background-color: #c0c0c0; 
            font-family: "Times New Roman", Times, serif;
            color: #000;
            padding: 20px;
        }
        h1 { color: #000080; text-decoration: underline; font-style: italic; }
        
        .win-panel {
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 15px;
            background: #c0c0c0;
            margin-bottom: 20px;
            text-align: left;
        }
        .section-title { font-weight: bold; font-size: 1.2rem; color: #800000; }
        
        .list-preview { 
            background: #fff; 
            border: 2px inset #808080; 
            font-size: 0.9rem; 
            padding: 8px; 
            margin: 8px 0;
            min-height: 20px;
            max-height: 80px;
            overflow-y: auto;
        }

        button {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #404040 #404040 #ffffff;
            cursor: pointer;
            padding: 5px 10px;
            font-weight: bold;
            font-family: "Times New Roman";
        }
        button:active { border-color: #404040 #ffffff #ffffff #404040; }
        
        input[type="text"] { border: 2px inset #ffffff; padding: 3px; width: 70%; }

        #final-result {
            background: #000080;
            color: #ffff00;
            padding: 20px;
            border: 4px double #ffffff;
            font-size: 1.5rem;
            display: none; 
            margin-top: 20px;
        }

        .marquee-container {
            background: #000;
            border: 3px outset #fff;
            padding: 10px 0;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .wavy-letter {
            display: inline-block;
            font-family: "Comic Sans MS", "Arial", sans-serif;
            font-size: 20pt;
            font-weight: bold;
            animation: sineWave 1.5s ease-in-out infinite;
        }
        @keyframes sineWave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .c1 { color: #ff0000; } .c2 { color: #ff8000; } .c3 { color: #ffff00; }
        .c4 { color: #00ff00; } .c5 { color: #00ffff; } .c6 { color: #0000ff; }
        .c7 { color: #ff00ff; }

        .reset-btn { background: #ffaaaa; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="marquee-container">
        <marquee scrollamount="15">
            <div id="wavyText"></div>
        </marquee>
    </div>
    
    <h1>Game Project Generator</h1>

    <div class="win-panel">
        <span class="section-title">1. Dimension Pool</span><br>
        <div class="list-preview" id="dimensionDisplay"></div>
        <p><small>* Dimension types are fixed to system defaults.</small></p>
    </div>

    <div class="win-panel">
        <span class="section-title">2. Genres Pool</span><br>
        <div class="list-preview" id="genreDisplay"></div>
        <input type="text" id="genreInput" placeholder="Enter genres separated by commas...">
        <button onclick="addItems('genre')">Add to List</button>
        <br><br>
        <input type="checkbox" id="disableDefaultGenre"> <label for="disableDefaultGenre">Disable Default Genres</label>
    </div>

    <div class="win-panel">
        <span class="section-title">3. Themes Pool</span><br>
        <div class="list-preview" id="themeDisplay"></div>
        <input type="text" id="themeInput" placeholder="Space, Horror, Noir...">
        <button onclick="addItems('theme')">Add to List</button>
        <br><br>
        <input type="checkbox" id="disableDefaultTheme"> <label for="disableDefaultTheme">Disable Default Themes</label>
    </div>

    <div class="win-panel">
        <span class="section-title">4. Wild Card (Twists/Mechanics)</span><br>
        <div class="list-preview" id="wildcardDisplay"></div>
        <input type="text" id="wildcardInput" placeholder="Permadeath, Time Loop, No Jumping...">
        <button onclick="addItems('wildcard')">Add to List</button>
        <br><br>
        <input type="checkbox" id="disableDefaultWildcard"> <label for="disableDefaultWildcard">Disable Default Wildcards</label>
    </div>

    <button style="font-size: 1.5rem; width: 100%; height: 60px;" onclick="generateIdea()">
        [ GENERATE MY GAME IDEA ]
    </button>

    <div id="final-result">
        *** CALCULATION COMPLETE ***<br><br>
        <span id="output-text"></span>
    </div>

    <p align="center">
        <button class="reset-btn" onclick="resetAll()">RESET ALL CUSTOM DATA</button><br><br>
        <a href="index.html">Click here to go back to Homepage</a>
    </p>

    <script>
        // --- DATA SETUP ---
        const defaultDimensions = ["Text", "2D", "3D", "Mixed-medium"];
        const defaultGenres = ["Metroidvania", "Soulslike", "Farm Sim", "Puzzler", "Bullet Hell"];
        const defaultThemes = ["Cyberpunk", "Medieval", "Underwater", "Deep Space", "Post-Apocalyptic"];
        const defaultWildcards = ["Permadeath", "Time Loop", "One Hit Kill", "Gravity Manipulation", "No Combat"];

        let userGenres = JSON.parse(localStorage.getItem('userGenres')) || [];
        let userThemes = JSON.parse(localStorage.getItem('userThemes')) || [];
        let userWildcards = JSON.parse(localStorage.getItem('userWildcards')) || [];

        // --- MARQUEE ---
        const marqueeText = "WELCOME TO THE ULTIMATE GAME IDEA GENERATOR!";
        const marqueeContainer = document.getElementById('wavyText');
        marqueeText.split('').forEach((char, i) => {
            const span = document.createElement('span');
            span.innerText = char === " " ? "\u00A0" : char;
            span.className = 'wavy-letter c' + ((i % 7) + 1);
            span.style.animationDelay = (i * 0.1) + 's';
            marqueeContainer.appendChild(span);
        });

        // --- LOGIC ---
        updatePreviews();

        function addItems(category) {
            const input = document.getElementById(category + 'Input');
            const newItems = input.value.split(',').map(item => item.trim()).filter(item => item !== "");
            
            if (category === 'genre') {
                userGenres = [...userGenres, ...newItems];
                localStorage.setItem('userGenres', JSON.stringify(userGenres));
            } else if (category === 'theme') {
                userThemes = [...userThemes, ...newItems];
                localStorage.setItem('userThemes', JSON.stringify(userThemes));
            } else if (category === 'wildcard') {
                userWildcards = [...userWildcards, ...newItems];
                localStorage.setItem('userWildcards', JSON.stringify(userWildcards));
            }
            
            input.value = "";
            updatePreviews();
        }

        function updatePreviews() {
            document.getElementById('dimensionDisplay').innerText = "Current Pool: " + defaultDimensions.join(', ');

            const genPool = [...(document.getElementById('disableDefaultGenre').checked ? [] : defaultGenres), ...userGenres];
            document.getElementById('genreDisplay').innerText = "Current Pool: " + (genPool.join(', ') || "(Empty)");
            
            const themePool = [...(document.getElementById('disableDefaultTheme').checked ? [] : defaultThemes), ...userThemes];
            document.getElementById('themeDisplay').innerText = "Current Pool: " + (themePool.join(', ') || "(Empty)");

            const wildPool = [...(document.getElementById('disableDefaultWildcard').checked ? [] : defaultWildcards), ...userWildcards];
            document.getElementById('wildcardDisplay').innerText = "Current Pool: " + (wildPool.join(', ') || "(Empty)");
        }

        function generateIdea() {
            const randDim = defaultDimensions[Math.floor(Math.random() * defaultDimensions.length)];
            const genrePool = document.getElementById('disableDefaultGenre').checked ? userGenres : [...defaultGenres, ...userGenres];
            const themePool = document.getElementById('disableDefaultTheme').checked ? userThemes : [...defaultThemes, ...userThemes];
            const wildPool = document.getElementById('disableDefaultWildcard').checked ? userWildcards : [...defaultWildcards, ...userWildcards];

            if (genrePool.length === 0 || themePool.length === 0 || wildPool.length === 0) {
                alert("SYSTEM ERROR: One of your pools is empty!");
                return;
            }

            const randGenre = genrePool[Math.floor(Math.random() * genrePool.length)];
            const randTheme = themePool[Math.floor(Math.random() * themePool.length)];
            const randWild = wildPool[Math.floor(Math.random() * wildPool.length)];

            document.getElementById('final-result').style.display = "block";
            document.getElementById('output-text').innerHTML = 
                `PROPOSAL: A <strong>${randDim} ${randGenre}</strong> game with a <strong>${randTheme}</strong> theme. <br><br> <u>WILDCARD TWIST:</u> <strong>${randWild}</strong>`;
            
            window.scrollTo(0, document.body.scrollHeight);
        }

        function resetAll() {
            if(confirm("Are you sure you want to clear ALL custom data?")) {
                localStorage.clear();
                userGenres = []; userThemes = []; userWildcards = [];
                updatePreviews();
            }
        }

        ['disableDefaultGenre', 'disableDefaultTheme', 'disableDefaultWildcard'].forEach(id => {
            document.getElementById(id).addEventListener('change', updatePreviews);
        });
    </script>
</body>
</html>
