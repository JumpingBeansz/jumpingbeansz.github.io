<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>*** GAME IDEA GENERATOR 2000 ***</title>
    <style>
        /* 90s Retro Styles */
        body { 
            background-color: #c0c0c0; /* Classic Classic Grey */
            font-family: "Times New Roman", Times, serif;
            color: #000;
            padding: 20px;
        }
        h1 { color: #000080; text-decoration: underline; font-style: italic; }
        .win-panel {
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 15px;
            background: #c0c0c0;
            margin-bottom: 20px;
            text-align: left;
        }
        .section-title { font-weight: bold; font-size: 1.2rem; color: #800000; }
        .list-preview { 
            background: #fff; 
            border: 1px inset #808080; 
            font-size: 0.8rem; 
            padding: 5px; 
            margin: 5px 0;
            max-height: 50px;
            overflow-y: auto;
        }
        button {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #404040 #404040 #ffffff;
            cursor: pointer;
            padding: 5px 10px;
            font-weight: bold;
        }
        button:active { border-color: #404040 #ffffff #ffffff #404040; }
        input[type="text"] { border: 2px inset #ffffff; padding: 3px; width: 80%; }
        #final-result {
            background: #000080;
            color: #ffff00;
            padding: 20px;
            border: 4px double #ffffff;
            font-size: 1.5rem;
            display: none; /* Hidden until generated */
            margin-top: 20px;
        }
        marquee { border: 1px solid #000; background: #fff; margin-bottom: 10px; }
    </style>
</head>
<body>

    <marquee>WELCOME TO THE ULTIMATE GAME IDEA GENERATOR! OPTIMIZED FOR NETSCAPE NAVIGATOR 4.0</marquee>
    
    <h1>Game Project Generator</h1>

    <div class="win-panel">
        <span class="section-title">1. Dimension Type</span><br>
        <select id="typeSelect">
            <option value="Text-Based">Text-Based</option>
            <option value="2D">2D</option>
            <option value="3D">3D</option>
        </select>
    </div>

    <div class="win-panel">
        <span class="section-title">2. Genres</span><br>
        <div class="list-preview" id="genreDisplay"></div>
        <input type="text" id="genreInput" placeholder="Enter genres separated by commas...">
        <button onclick="addItems('genre')">Add to List</button>
        <br><br>
        <input type="checkbox" id="disableDefaultGenre"> <label for="disableDefaultGenre">Disable Default Genres</label>
    </div>

    <div class="win-panel">
        <span class="section-title">3. Themes</span><br>
        <div class="list-preview" id="themeDisplay"></div>
        <input type="text" id="themeInput" placeholder="Space, Horror, Noir...">
        <button onclick="addItems('theme')">Add to List</button>
        <br><br>
        <input type="checkbox" id="disableDefaultTheme"> <label for="disableDefaultTheme">Disable Default Themes</label>
    </div>

    <button style="font-size: 1.5rem; width: 100%; height: 50px;" onclick="generateIdea()">
        GENERATE MY GAME IDEA!
    </button>

    <div id="final-result">
        *** YOUR GAME IDEA ***<br>
        <span id="output-text"></span>
    </div>

    <p align="center">
        <a href="index.html">Click here to go back to Homepage</a>
    </p>

    <script>
        // Data
        let defaultGenres = ["Metroidvania", "Soulslike", "Farm Sim", "Puzzler", "Bullet Hell"];
        let defaultThemes = ["Cyberpunk", "Medieval", "Underwater", "Deep Space", "Post-Apocalyptic"];

        let userGenres = JSON.parse(localStorage.getItem('userGenres')) || [];
        let userThemes = JSON.parse(localStorage.getItem('userThemes')) || [];

        // Refresh displays on load
        updatePreviews();

        function addItems(category) {
            const input = document.getElementById(category + 'Input');
            const newItems = input.value.split(',').map(item => item.trim()).filter(item => item !== "");
            
            if (category === 'genre') {
                userGenres = [...userGenres, ...newItems];
                localStorage.setItem('userGenres', JSON.stringify(userGenres));
            } else {
                userThemes = [...userThemes, ...newItems];
                localStorage.setItem('userThemes', JSON.stringify(userThemes));
            }
            
            input.value = "";
            updatePreviews();
        }

        function updatePreviews() {
            document.getElementById('genreDisplay').innerText = "Current Pool: " + 
                ([...(document.getElementById('disableDefaultGenre').checked ? [] : defaultGenres), ...userGenres]).join(', ');
            
            document.getElementById('themeDisplay').innerText = "Current Pool: " + 
                ([...(document.getElementById('disableDefaultTheme').checked ? [] : defaultThemes), ...userThemes]).join(', ');
        }

        function generateIdea() {
            const type = document.getElementById('typeSelect').value;

            // Determine Genre Pool
            const useOnlyUserGenre = document.getElementById('disableDefaultGenre').checked;
            const genrePool = useOnlyUserGenre ? userGenres : [...defaultGenres, ...userGenres];

            // Determine Theme Pool
            const useOnlyUserTheme = document.getElementById('disableDefaultTheme').checked;
            const themePool = useOnlyUserTheme ? userThemes : [...defaultThemes, ...userThemes];

            if (genrePool.length === 0 || themePool.length === 0) {
                alert("Error: Your lists are empty! Please add or enable some items.");
                return;
            }

            const randGenre = genrePool[Math.floor(Math.random() * genrePool.length)];
            const randTheme = themePool[Math.floor(Math.random() * themePool.length)];

            const resultBox = document.getElementById('final-result');
            const resultText = document.getElementById('output-text');
            
            resultBox.style.display = "block";
            resultText.innerHTML = `A ${type} ${randGenre} game set in a ${randTheme} world.`;
        }

        // Add event listeners to checkboxes to update previews instantly
        document.getElementById('disableDefaultGenre').addEventListener('change', updatePreviews);
        document.getElementById('disableDefaultTheme').addEventListener('change', updatePreviews);
    </script>
</body>
</html>
